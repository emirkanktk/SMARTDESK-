# Builds and tests both halves of the app on every pull request (whatever its base, so
# stacked PRs are checked too), on every push to main, and on demand. Needs no secrets.
# Unit tests use in-memory SQLite; integration tests start PostgreSQL with Testcontainers.
# Frontend tests use jsdom. The browser tests run the whole app - PostgreSQL, the API with the
# Development seed, ng serve - and drive it in Chromium (#72).
# The docker job builds both images and runs docker-compose.yml's app profile (ADR-0031).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run, for when GitHub drops a push event and main is left without a result.
  workflow_dispatch:

# A newer push to the same PR or branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - build, test, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore SmartDesk.slnx

      - run: dotnet build SmartDesk.slnx --no-restore --configuration Release

      - run: dotnet test SmartDesk.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      # The PR checklist asks for a migration whenever the model changes; this makes CI check
      # it. Fails if SmartDeskDbContext's model differs from the latest migration snapshot.
      - name: Model changes come with a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes \
            --project src/SmartDesk.Infrastructure \
            --startup-project src/SmartDesk.API \
            --configuration Release --no-build

  frontend:
    name: Frontend - build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Cheap, and they'd otherwise only show up in review: a text with no Turkish version
      # appears in English on a Turkish screen.
      - name: Every text has its Turkish version
        run: npm run i18n:check

      - name: Code is formatted with Prettier
        run: npm run format:check

      # ng test compiles specs without checking their types, so a spec that builds a model
      # with a missing field would still run.
      - name: Specs and browser tests type-check
        run: |
          npx tsc -p tsconfig.spec.json --noEmit
          npx tsc -p e2e/tsconfig.json --noEmit

      - run: npx ng build

      - run: npx ng test --watch=false

      # The runner is on UTC, where local and UTC dates are the same and zone bugs stay
      # hidden. Run the specs again in zones with DST changes and odd offsets (see
      # frontend/scripts/test-time-zones.mjs for the list).
      - name: Unit tests in other time zones
        run: npm run test:time-zones

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartdesk
          POSTGRES_USER: smartdesk
          POSTGRES_PASSWORD: smartdesk_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdesk -d smartdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The https launch profile runs the API in Development, so it seeds the demo users and
      # resources the tests sign in with, and sends emails to the log instead of SMTP.
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=smartdesk;Username=smartdesk;Password=smartdesk_ci_only
      Database__MigrateOnStartup: 'true'
      # Playwright's own Chromium; locally the tests use the installed Edge.
      E2E_CHANNEL: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # A signing key made for this run only, never stored anywhere.
      - name: JWT key for this run
        run: echo "Jwt__Key=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      # The dev proxy talks to the API over https without checking the certificate, and so do
      # the tests' own API calls, so the development certificate needn't be trusted.
      - name: Start the API
        run: |
          dotnet dev-certs https
          dotnet build src/SmartDesk.API --configuration Debug
          nohup dotnet run --project src/SmartDesk.API --launch-profile https --no-build > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -skf https://localhost:7065/health > /dev/null && exit 0
            sleep 2
          done
          cat api.log
          exit 1

      - name: Install the frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the frontend
        working-directory: frontend
        run: |
          nohup npx ng serve --port 4200 > ng.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 2
          done
          cat ng.log
          exit 1

      - name: Browser tests
        working-directory: frontend
        run: npm run e2e

      # Traces replay a failed test step by step: npx playwright show-trace <file>.
      - name: Keep the report, traces and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/ng.log
            api.log
          retention-days: 7

  docker:
    name: Docker - the whole app in containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The browser and the tests' own API calls both go through nginx (ADR-0031).
      E2E_BASE_URL: http://localhost:4200
      E2E_API_URL: http://localhost:4200/api
      E2E_CHANNEL: ''
    steps:
      - uses: actions/checkout@v7

      # A signing key made for this run only; docker-compose.yml hands it to the API.
      - name: JWT key for this run
        run: echo "JWT_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      # Both images, then PostgreSQL, Mailpit, Seq, the API and nginx, until each is healthy.
      - name: Build and start the app profile
        run: docker compose --profile app up -d --build --wait --wait-timeout 300

      - name: nginx serves the app and passes the API on
        run: |
          curl -fsS http://localhost:4200/ | grep -q '<app-root>'
          curl -fsS http://localhost:4200/reservations/mine | grep -q '<app-root>'
          curl -fsS http://localhost:4200/i18n/tr.json > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/api/assistant)" = 401

      # The installed app's files (ADR-0054): the worker and its list checked again on every
      # visit, not kept a year like the hashed scripts, and the manifest as a manifest.
      - name: nginx serves the service worker and the manifest
        run: |
          curl -fsS http://localhost:4200/ngsw.json | grep -q '"configVersion"'
          curl -fsSI http://localhost:4200/ngsw-worker.js | grep -qi '^cache-control: no-cache'
          curl -fsSI http://localhost:4200/manifest.webmanifest | grep -qi '^content-type: application/manifest+json'

      # That 401 is in Seq as a line of its own, found by its fields (ADR-0053). Seq gets the
      # API's lines every few seconds.
      - name: The API's logs reach Seq
        run: |
          query="http://localhost:5341/api/events?count=1&filter=RequestPath%20%3D%20'%2Fapi%2Fassistant'%20and%20StatusCode%20%3D%20401"
          for i in $(seq 1 30); do
            curl -fsS "$query" | grep -q '"StatusCode","Value":401' && exit 0
            sleep 2
          done
          curl -sS "http://localhost:5341/api/events?count=10"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the browser tests and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Signing in, a booking with a conflict, one showing up live in another window over
      # SignalR's WebSocket, the language switch, and the app installed and opened offline, all
      # through nginx.
      - name: Browser tests through nginx
        working-directory: frontend
        run: npx playwright test e2e/booking.spec.ts e2e/language.spec.ts e2e/pwa.spec.ts

      - name: Keep the containers' logs of a failed run
        if: failure()
        run: docker compose --profile app logs --no-color > compose.log

      - name: Keep the report, traces and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker
          path: |
            compose.log
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
