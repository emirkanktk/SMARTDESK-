services:
  postgres:
    image: postgres:17-alpine
    container_name: smartdesk-postgres
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: smartdesk_dev_only
    ports:
      - "5432:5432"
    volumes:
      - smartdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdesk -d smartdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends in Development; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: smartdesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # The API's logs, each line with its fields, to search at http://localhost:5341 (ADR-0053).
  # Seq is free for one person's development; ACCEPT_EULA accepts its licence for that. It has
  # no sign-in, so it answers this machine only.
  seq:
    image: datalust/seq:2026.1
    container_name: smartdesk-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - smartdesk-seq-data:/data

  # Opt-in. `docker compose up -d` starts PostgreSQL, Mailpit and Seq only; the `api` profile
  # adds the API on port 8080, and the `app` profile the API and the app behind nginx (`web`).
  api:
    build: .
    profiles: ["api", "app"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartdesk;Username=smartdesk;Password=smartdesk_dev_only
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:-}
      Email__Smtp__Host: mailpit
      Seq__ServerUrl: http://seq
      # nginx in `web` is the reverse proxy whose X-Forwarded-For it believes (ADR-0028).
      ForwardedHeaders__KnownProxies__0: 172.28.42.10
    networks: [default, proxy]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Opt-in, with the API: `docker compose --profile app up -d --build` serves the whole app at
  # http://localhost:4200 (ADR-0031). That's the address `ng serve` uses and the API's
  # Development settings expect, so stop `ng serve` first.
  web:
    build: ./frontend
    profiles: ["app"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.28.42.10
    ports:
      - "4200:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

# Just nginx and the API, with a fixed address for nginx so the API knows which proxy to trust.
# Pick another subnet if this one is taken on your machine, and change both addresses above.
networks:
  proxy:
    ipam:
      config:
        - subnet: 172.28.42.0/24

volumes:
  smartdesk-postgres-data:
  smartdesk-seq-data:
