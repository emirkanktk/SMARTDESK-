<form class="temporary-password" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label [for]="inputId">Temporary password for {{ name() }}</label>
  <div class="row">
    <input
      [id]="inputId"
      type="text"
      class="input input-sm"
      autocomplete="off"
      spellcheck="false"
      formControlName="password"
      [class.invalid]="!!error()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="inputId + '-help'"
    />
    <button type="button" class="btn btn-secondary btn-sm" (click)="generate()">Generate</button>
    <button type="submit" class="btn btn-primary btn-sm" [disabled]="busy()">
      {{ busy() ? 'Saving…' : 'Set' }}
    </button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancelled.emit()">
      Cancel
    </button>
  </div>
  <span [id]="inputId + '-help'">
    @if (error(); as message) {
      <span class="field-error">{{ message }}</span>
    } @else {
      <span class="text-muted hint">
        Tell them in person. Their other sessions end, and they choose their own when they next sign
        in.
      </span>
    }
  </span>
</form>
