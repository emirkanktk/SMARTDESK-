<header class="bar">
  <a class="brand" routerLink="/dashboard"><app-logo /></a>

  <nav class="nav" aria-label="Main" i18n-aria-label="@@nav.label">
    @for (item of visibleNavItems(); track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
        ariaCurrentWhenActive="page"
      >
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="user">
    <div class="identity">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="who">
        <span class="user-name">{{ displayName() }}</span>
        @if (roleBadge(); as role) {
          <span class="badge">{{ role }}</span>
        }
      </span>
    </div>
    <div class="preferences">
      <app-language-switch />
      <app-theme-switch />
    </div>
    <div class="account">
      <a class="btn btn-secondary btn-sm" routerLink="/change-password">
        <app-icon name="key" />
        <span i18n="@@nav.password">Password</span>
      </a>
      <button type="button" class="btn btn-secondary btn-sm" (click)="logout()">
        <app-icon name="logout" />
        <span i18n="@@nav.signOut">Sign out</span>
      </button>
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
