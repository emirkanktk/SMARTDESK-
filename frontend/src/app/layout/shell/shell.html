<header class="topbar">
  <a class="brand" routerLink="/dashboard">SmartDesk</a>

  <nav class="nav" aria-label="Main" i18n-aria-label="@@nav.label">
    @for (item of visibleNavItems(); track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
    }
  </nav>

  <div class="user">
    <span class="user-name">{{ displayName() }}</span>
    @if (roleBadge(); as role) {
      <span class="badge">{{ role }}</span>
    }
    <app-language-switch />
    <app-theme-switch />
    <a class="btn btn-secondary btn-sm" routerLink="/change-password" i18n="@@nav.password"
      >Password</a
    >
    <button type="button" class="btn btn-secondary btn-sm" (click)="logout()" i18n="@@nav.signOut">
      Sign out
    </button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
