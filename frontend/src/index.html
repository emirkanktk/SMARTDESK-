<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- What may run on the page (ADR-0060): the app's own scripts, from its own address, and the
         theme script below by its hash. Nothing slipped into the page runs, and no plugin, <base>
         or form takes it elsewhere. What a page can't say for itself, such as who may show it in
         a frame, the server says (security-headers.conf). A changed theme script needs its new
         hash here: npm run csp:check gives it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'sha256-5UXv8kE/EAJ2NyoSzRB33nsM+9eaRgoZxCtUFKQVitI='; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>SmartDesk</title>
    <base href="/" />
    <!-- viewport-fit=cover: the page reaches a phone's rounded edges, and the tab bar keeps its
         buttons clear of the home indicator with env(safe-area-inset-bottom) (ADR-0055). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Installable on a phone or a computer (ADR-0054). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- An iPhone's home screen takes this PNG; it ignores the manifest's icons. Opened from
         there, the app has its own name and a status bar that keeps clear of the page. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartDesk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The status bar's colour: the top bar's, set again with the theme (theme.service.ts). -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The colour theme before anything is drawn, so a dark page never flashes white: the
      // stored choice, or the system's setting (core/theme/theme.service.ts keeps it after).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('smartdesk_theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var bars = document.querySelector('meta[name="theme-color"]');
        if (bars) bars.setAttribute('content', theme === 'dark' ? '#111727' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
