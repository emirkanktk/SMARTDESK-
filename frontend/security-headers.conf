# The security headers on every file of the app (ADR-0060): nginx.conf includes them in each of
# its locations, and scripts/serve-build.mjs reads them from here, so the two can't drift. What
# may run on the page is index.html's own policy; these are what a page can't say for itself.
# The API's answers keep the API's own headers.

# No other site shows the app in a frame of its own, where a click meant for that site lands on
# a button of ours (clickjacking). X-Frame-Options says the same to browsers before CSP 2.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# Each file is what its type says, never a script or a page guessed from its content.
add_header X-Content-Type-Options "nosniff" always;
# Another site learns nothing of the page a link to it was on, not even the address.
add_header Referrer-Policy "same-origin" always;
# A window of another site, whether it opened the app or the app opened it, gets no hold on it.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The app uses no camera, microphone, location, payment or USB device: nothing on it may ask.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
