# The app in a container (ADR-0031): nginx serves the production build and passes /api and
# /hubs on to the API container, so the browser sees one origin, as with `ng serve`. The
# session cookie is the API's own and needs that (ADR-0026).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The access log leaves out query strings, and the Referer that can carry one: they hold
# secrets. SignalR sends its access token there, and the password reset link its token.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format no_query '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's own DNS, asked again every few seconds: a restarted API container may come back
    # with another address, and nginx starts even before the API is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location ^~ /api/ {
        proxy_pass $api;
        # The client's address and scheme. The API believes them from this container only
        # (ForwardedHeaders:KnownProxies in docker-compose.yml, ADR-0028), so each user gets
        # their own sign-in limit.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A resource photo's upload may be up to 8 MB (ADR-0027), and the assistant may take
        # up to Assistant:TimeoutSeconds, 90 s, to answer (ADR-0029).
        client_max_body_size 8m;
        proxy_read_timeout 120s;
    }

    # SignalR (ADR-0014): a WebSocket, open for as long as the app is. Unbuffered, so its
    # fallbacks (Server-Sent Events, long polling) aren't held back either.
    location ^~ /hubs/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The service worker's own scripts have no hash in their names (ADR-0054). Checked again on
    # every visit like index.html: kept for a year, they'd keep a phone on an old release.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /smartdesk-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /worker-basic.min.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Scripts, styles and fonts carry a hash of their content in the name: keep them a year.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app's own routes get index.html. That, the pictures and the translations are checked
    # again on every visit, so a new release shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
